version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${UVICORN_PORT:-8006}
    env_file:
      - ./.env
    environment:
      - LOG_FILE=/var/log/app.log
    ports:
      - "${UVICORN_PORT:-8006}:${UVICORN_PORT:-8006}"
    restart: unless-stopped
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/log/:/var/log/

    networks:
      - dokploy-network


networks:
  dokploy-network:
    external: true
