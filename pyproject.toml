[project]
dependencies = [
  "aio-pika>=9.5.5",
  "aioboto3==13.1",
  "alembic>=1.16.1",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.12",
  "faststream[cli,rabbit]>=0.5.42",
  "greenlet>=3.2.2",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "passlib>=1.7.4",
  "pydantic-settings>=2.9.1",
  "pydantic[email]>=2.11.5",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.1.1",
  "python-jose>=3.4.0",
  "python-multipart>=0.0.20",
  "pytz>=2025.2",
  "redis>=6.2.0",
  "sqlalchemy>=2.0.41",
  "uvicorn>=0.34.2",
  "vulture>=2.14",
]
description = "Add your description here"
name = "gidrator-backend"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = [
  "black",
  "flake8",
  "isort",
  "mypy",
  "pytest",
  "pytest-asyncio",
]

[tool.setuptools]
packages = ["app", "scripts"]

[project.scripts]
activate = "scripts.commands:activate"
check = "scripts.commands:check"
dev = "scripts.commands:dev"
format = "scripts.commands:format"
lint = "scripts.commands:lint"
migrate = "scripts.commands:migrate"
prod = "scripts.commands:prod"
serve = "scripts.commands:serve"
setup = "scripts.commands:setup"
start = "scripts.commands:start_all"
test = "scripts.commands:test"

[tool.pytest.ini_options]
addopts = [
  "-v",
  "--tb=short",
  "--strict-markers",
  "--disable-warnings",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = [
  "ignore::pydantic.PydanticDeprecatedSince20",
  "ignore::DeprecationWarning",
]
markers = [
  "unit: Unit tests (fast, mocked)",
  "integration: Integration tests (mocked external services)",
  "functional: Functional tests (real DB, full cycle)",
  "security: Security tests",
  "performance: Performance tests",
  "e2e: End-to-end tests (full user scenarios)",
  "slow: marks tests as slow",
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
ignore_errors = true
module = "app.core.migrations.*"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[dependency-groups]
dev = [
  "pytest-httpx>=0.35.0",
]

[tool.pylint.messages_control]
disable = [
  "unsubscriptable-object",
  "not-callable",
  "no-member",
]
